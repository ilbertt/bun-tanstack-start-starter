name: codestyle

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  codestyle:
    name: codestyle:required
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare

      - name: Check JS Codestyle
        run: bun codestyle:check
