name: Prepare
description: Prepare the environment for the workflow

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - uses: actions/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
